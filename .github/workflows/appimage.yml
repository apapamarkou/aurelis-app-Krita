name: Aurelis-Application-Build
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
on:
  schedule:
    - cron: "0 7 1/21 * *" # We default to rebuilding every 21 days, change this to your liking
  workflow_dispatch: {}

jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - { runs-on: ubuntu-latest, name: Build AppImage, arch: x86_64 }
          # comment out this line if aarch64 is not wanted
          # - { runs-on: ubuntu-24.04-arm, name: Build AppImage, arch: aarch64 }
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd # v6
      - name: Install Dependencies
        run: /bin/sh ./get-dependencies.sh
      - name: Make AppImage
        run: /bin/sh ./make-appimage.sh
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  # this part runs via QEMU so expect higher CI times
  build-additional-cpu-arches:
    if: false # set to true to build the below arches
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # comment out the arches that are not wanted
          # note 'if: false' is set by default and these are all turned off
          # - { name: Build AppImage, arch: riscv64, platform: linux/riscv64 }
          # - { name: Build AppImage, arch: loongarch64, platform: linux/loong64 }
          # - { name: Build AppImage, arch: ppc64le, platform: linux/ppc64le }
          # - { name: Build AppImage, arch: ppc64, platform: linux/ppc64 } # BE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build AppImage (emulated)
        uses: pkgforge-dev/anylinux-setup-action/emulated@ba7321e11074f9e387a0634e653d09b115d576cd # v6
        with:
          platform: ${{ matrix.platform }}
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  release:
    if: ${{ github.ref_name == 'main' }}
    needs: [build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AppImage-*
          merge-multiple: true
      - name: Read version
        run: |
          V=$(awk -F= '/X-AppImage-Version/{print $2; exit}' ./appinfo | tr ':' '.')
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          name: "Kate ${{ env.VERSION }}"
          tag_name: "${{ env.VERSION }}"
          make_latest: true
          files: "*"
